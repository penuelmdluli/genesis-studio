name = "genesis-cron"
main = "cron-handler.js"
compatibility_date = "2024-09-23"

[triggers]
crons = [
  "0 3 * * *",
  "0 9 * * *",
  "0 16,17 * * *",
  "*/5 * * * *",
  "0 */6 * * *",
  "*/1 * * * *",
  "*/2 * * * *",
  "*/30 * * * *",
  "*/15 * * * *",
  "0 * * * *",
]

[vars]
APP_URL = "https://ivideostudio.ai"
