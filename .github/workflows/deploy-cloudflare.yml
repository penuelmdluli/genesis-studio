name: Deploy to Cloudflare

# main IS production. Every push to main builds and deploys main, so main must
# always hold the newest code: never push a stale main, and merge working
# branches into main before (or instead of) deploying them by hand. A manual
# deploy from another branch is overwritten by the next push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes close together must not race: the later deploy always wins.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    # Public build-time values (baked into the bundle, not secrets). Without
    # them a CI build differs from a local build that reads .env.local.
    env:
      NEXT_PUBLIC_APP_URL: https://ivideostudio.ai
      NEXT_PUBLIC_SITE_URL: https://ivideostudio.ai
      NEXT_PUBLIC_APP_NAME: Genesis Studio
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: fawr-hEr8R4ybGpcNOIb8SyrgJrW7jiQkbjqPOvOJ2s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare for OpenNext build
        run: |
          # OpenNext expects middleware.ts; Next.js 16 uses proxy.ts
          rm -f src/proxy.ts

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fail loudly if the deploy is missing routes production relies on.
      - name: Smoke test live routes
        run: |
          sleep 20
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://ivideostudio.ai$1")
            echo "$1 -> $code (want $2)"
            [ "$code" = "$2" ]
          }
          check /api/series 401
          check /api/tools 200
